[project]
name = "yk-agent"
version = "0.1.0"
description = "个性化旅游推荐智能体：画像驱动 + 自主编排 + Skill/MCP/Plugin 扩展"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "redis>=5.0",
    "openai>=1.40",        # 火山方舟兼容 OpenAI 协议，仅允许在 llm/ 抽象层内使用
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yk_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
